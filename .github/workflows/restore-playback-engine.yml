name: Restore PlaybackEngine

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-playback-engine.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore PlaybackEngine from HydeYYHH/Litube and apply CC patch
        run: |
          set -euo pipefail
          UPSTREAM=https://raw.githubusercontent.com/HydeYYHH/Litube/master/app/src/main/java/com/hhst/youtubelite/player/engine/PlaybackEngine.kt
          TARGET=app/src/main/java/com/hhst/youtubelite/player/engine/PlaybackEngine.kt
          curl -fsSL "$UPSTREAM" -o "$TARGET"
          test -s "$TARGET"
          if [ -f fix-cc-playback-fallback.patch ]; then
            git apply fix-cc-playback-fallback.patch || patch -p1 < fix-cc-playback-fallback.patch
          fi
          grep -q subtitleFallbackOnFailure "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(player): restore PlaybackEngine and keep video alive when CC fails"
            git push
          fi
